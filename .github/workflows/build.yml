name: Build Ghost Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Source Code
        run: |
          mkdir -p app/src/main/java/com/ghost/launcher
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GhostLauncher"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.ghost.launcher'
              compileSdk 34

              defaultConfig {
                  applicationId "com.ghost.launcher"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <application
                  android:label=" "
                  android:icon="@drawable/ic_transparent"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:clearTaskOnLaunch="true"
                      android:stateNotNeeded="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_transparent.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="48"
              android:viewportHeight="48">
              <path
                  android:fillColor="#00000000"
                  android:pathData="M0,0h48v48h-48z" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/java/com/ghost/launcher/MainActivity.kt
          package com.ghost.launcher

          import androidx.appcompat.app.AppCompatActivity
          import androidx.appcompat.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ResolveInfo
          import android.os.Bundle
          import android.view.View
          import android.widget.*

          class MainActivity : AppCompatActivity() {

              // Master PIN to reveal hidden apps
              private val SECRET_PIN = "1234"
              private var isVaultUnlocked = false

              private lateinit var appListView: ListView
              private lateinit var sharedPrefs: android.content.SharedPreferences

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  sharedPrefs = getSharedPreferences("ghost_settings", Context.MODE_PRIVATE)

                  val rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(32, 64, 32, 32)
                  }

                  // Invisible 160px touch bar at the very top of your screen
                  val secretTrigger = View(this).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 
                          160
                      )
                      setOnLongClickListener {
                          showPinPrompt()
                          true
                      }
                  }
                  rootLayout.addView(secretTrigger)

                  appListView = ListView(this)
                  rootLayout.addView(appListView)
                  setContentView(rootLayout)

                  refreshAppList()
              }

              private fun getInstalledApps(): List<ResolveInfo> {
                  val mainIntent = Intent(Intent.ACTION_MAIN, null).apply {
                      addCategory(Intent.CATEGORY_LAUNCHER)
                  }
                  return packageManager.queryIntentActivities(mainIntent, 0)
              }

              private fun refreshAppList() {
                  val hiddenPackages = sharedPrefs.getStringSet("hidden_apps", emptySet()) ?: emptySet()
                  val allApps = getInstalledApps()

                  val visibleApps = if (isVaultUnlocked) {
                      allApps
                  } else {
                      allApps.filter { it.activityInfo.packageName !in hiddenPackages }
                  }

                  val appNames = visibleApps.map { it.loadLabel(packageManager).toString() }
                  val adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, appNames)
                  appListView.adapter = adapter

                  appListView.setOnItemClickListener { _, _, position, _ ->
                      val selectedApp = visibleApps[position]
                      val launchIntent = packageManager.getLaunchIntentForPackage(selectedApp.activityInfo.packageName)
                      launchIntent?.let { startActivity(it) }
                  }

                  if (isVaultUnlocked) {
                      appListView.setOnItemLongClickListener { _, _, position, _ ->
                          val selectedPkg = visibleApps[position].activityInfo.packageName
                          toggleAppVisibility(selectedPkg)
                          true
                      }
                  } else {
                      appListView.onItemLongClickListener = null
                  }
              }

              private fun toggleAppVisibility(pkgName: String) {
                  val hiddenSet = sharedPrefs.getStringSet("hidden_apps", emptySet())?.toMutableSet() ?: mutableSetOf()
                  if (hiddenSet.contains(pkgName)) {
                      hiddenSet.remove(pkgName)
                      Toast.makeText(this, "App unhidden", Toast.LENGTH_SHORT).show()
                  } else {
                      hiddenSet.add(pkgName)
                      Toast.makeText(this, "App hidden!", Toast.LENGTH_SHORT).show()
                  }
                  sharedPrefs.edit().putStringSet("hidden_apps", hiddenSet).apply()
                  refreshAppList()
              }

              private fun showPinPrompt() {
                  val input = EditText(this)
                  input.inputType = android.text.InputType.TYPE_CLASS_NUMBER or android.text.InputType.TYPE_NUMBER_VARIATION_PASSWORD

                  AlertDialog.Builder(this)
                      .setTitle("Enter PIN")
                      .setView(input)
                      .setPositiveButton("Unlock") { _, _ ->
                          if (input.text.toString() == SECRET_PIN) {
                              isVaultUnlocked = !isVaultUnlocked
                              val status = if (isVaultUnlocked) "Vault Unlocked" else "Vault Locked"
                              Toast.makeText(this, status, Toast.LENGTH_SHORT).show()
                              refreshAppList()
                          } else {
                              Toast.makeText(this, "Wrong PIN", Toast.LENGTH_SHORT).show()
                          }
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }
          }
          EOF

      - name: Build APK with Gradle
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GhostLauncher
          path: app/build/outputs/apk/debug/app-debug.apk
